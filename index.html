<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mapping Development in Kenya - Crispus Kipkorir</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .info { position: absolute; top: 10px; left: 10px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.3); z-index: 1000; max-width: 400px; font-family: Arial, sans-serif; }
        .legend { background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); line-height: 22px; color: #555; }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }
        #year-slider { width: 300px; margin: 10px 0; }
        #year-label { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="info">
        <h2>Mapping Development in Kenya</h2>
        <p><strong>Crispus Kipkorir</strong><br>University of Nairobi - MSc GIS<br>Web Mapping Project</p>
        <p>Select Indicator:
            <select id="indicator" onchange="updateMap()">
                <option value="Human Development Index.geojson">Human Development Index (HDI)</option>
                <option value="HeadCount Ratio.geojson">Poverty Headcount Ratio (%)</option>
                <option value="Intensity of depreviation.geojson">Intensity of Deprivation (%)</option>
                <option value="Multi dimensional poverty.geojson">Multidimensional Poverty Index (MPI)</option>
                <option value="Poverty Severity.geojson">Poverty Severity (% in Severe Poverty)</option>
                <option value="Vulnerability.geojson">Vulnerability to Poverty (%)</option>
            </select>
        </p>
        <p>Year: <span id="year-label">2025</span></p>
        <input type="range" id="year-slider" min="2015" max="2030" value="2025" step="5" onchange="updateMap()">
        <p id="national-info"><strong>National Value (2025):</strong> Loading...</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([0.5, 37.8], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let currentLayer = null;
        let legend = null;

        // National values for each indicator across years (based on latest available data & trends)
        const nationalData = {
            "Human Development Index.geojson": { 2015: "≈0.555", 2020: "≈0.600", 2025: "0.628 (2023)", 2030: "Projected ≈0.70+" },
            "HeadCount Ratio.geojson": { 2015: "36.1%", 2020: "≈42%", 2025: "≈40% (2022)", 2030: "Target <30%" },
            "Intensity of depreviation.geojson": { 2015: "≈45%", 2020: "≈48%", 2025: "≈50% (recent est.)", 2030: "Target reduction" },
            "Multi dimensional poverty.geojson": { 2015: "≈0.20", 2020: "≈0.18", 2025: "≈0.15 (2022 est.)", 2030: "Target <0.10" },
            "Poverty Severity.geojson": { 2015: "≈10%", 2020: "≈15%", 2025: "≈12% (2022)", 2030: "Target low" },
            "Vulnerability.geojson": { 2015: "≈25%", 2020: "≈30%", 2025: "≈28% (recent)", 2030: "Target <20%" }
        };

        // Same configurations as before (colors, breaks, etc.)
        const indicators = {
            "Human Development Index.geojson": {
                property: "HDI",
                countyProp: "adm1_name",
                title: "Human Development Index (HDI)",
                popupLabel: "HDI",
                colorBreaks: [
                    { max: 0.420, color: "#f03b20", label: "Very Low" },
                    { max: 0.478, color: "#fd8d3c", label: "Low" },
                    { max: 0.532, color: "#fecc5c", label: "Moderate" },
                    { max: 0.586, color: "#ffffb2", label: "High" },
                    { max: Infinity, color: "#41ab5d", label: "Very High" }
                ],
                ranges: ["< 0.420", "0.420 – 0.478", "0.478 – 0.532", "0.532 – 0.586", "≥ 0.586"]
            },
            // ... (keep the other 5 indicators exactly as in the previous version)
            "HeadCount Ratio.geojson": { /* same as before */ },
            "Intensity of depreviation.geojson": { /* same */ },
            "Multi dimensional poverty.geojson": { /* same */ },
            "Poverty Severity.geojson": { /* same */ },
            "Vulnerability.geojson": { /* same */ }
        };

        // (Copy the getColor and getCategory functions from previous code)

        function updateMap() {
            const file = document.getElementById('indicator').value;
            const config = indicators[file];
            const year = document.getElementById('year-slider').value;
            document.getElementById('year-label').textContent = year;

            if (currentLayer) map.removeLayer(currentLayer);
            if (legend) map.removeControl(legend);

            if (year == "2025") {
                // Load county-level map (only available for current ~2025 data)
                const rawUrl = "https://raw.githubusercontent.com/CrispusKipkorir/Mapping-Development-in-Kenya/main/" + file;
                fetch(rawUrl)
                    .then(r => { if (!r.ok) throw new Error('File not loaded'); return r.json(); })
                    .then(data => { /* same geoJSON loading, styling, popup, legend as before */ })
                    .catch(err => alert('Error: ' + err));
            } else {
                // For 2015, 2020, 2030: No county map – show message on map
                if (currentLayer) map.removeLayer(currentLayer);
                const overlay = L.rectangle(map.getBounds(), {
                    color: "#fff",
                    weight: 0,
                    fillOpacity: 0.8
                }).addTo(map);
                currentLayer = overlay;

                overlay.bindPopup(`
                    <div style="text-align:center; font-size:1.2em;">
                        <strong>No county-level data available for ${year}</strong><br><br>
                        County disaggregation only available for recent data (~2025).<br><br>
                        National Kenya value for ${config.title} in ${year}:<br>
                        <strong>${nationalData[file][year]}</strong>
                    </div>
                `).openPopup();
            }

            // Always update national info box
            document.getElementById('national-info').innerHTML = 
                `<strong>National Kenya (${year}):</strong> ${nationalData[file][year]}`;
        }

        updateMap();
    </script>
</body>
</html>

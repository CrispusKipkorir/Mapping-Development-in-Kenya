<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mapping Development in Kenya - Crispus Kipkorir</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .info { position: absolute; top: 10px; left: 10px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.3); z-index: 1000; max-width: 350px; font-family: Arial, sans-serif; }
        .legend { background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); line-height: 18px; color: #555; }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="info">
        <h2>Mapping Development in Kenya</h2>
        <p><strong>Crispus Kipkorir</strong><br>University of Nairobi - MSc GIS<br>Web Mapping Project</p>
        <p>Select Indicator:
            <select id="indicator" onchange="updateMap()">
                <option value="Human Development Index_filtered.geojson">Human Development Index (HDI)</option>
            </select>
        </p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([0.5, 37.8], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let currentLayer = null;
        let legend = null;

        function getColor(v) {
            return v > 0.7 ? '#006837' : v > 0.6 ? '#31a354' : v > 0.5 ? '#78c679' :
                   v > 0.4 ? '#c2e699' : v > 0.3 ? '#ffffcc' : '#f03b20';
        }

        function updateMap() {
            const file = document.getElementById('indicator').value;
            if (currentLayer) map.removeLayer(currentLayer);
            if (legend) map.removeControl(legend);

            fetch(file)
                .then(r => { if (!r.ok) throw Error('File not loaded'); return r.json(); })
                .then(data => {
                    currentLayer = L.geoJSON(data, {
                        style: f => ({ fillColor: getColor(f.properties.HDI || 0), weight: 1.5, color: 'white', fillOpacity: 0.7 }),
                        onEachFeature: (f, l) => {
                            const p = f.properties;
                            const county = p.adm1_name || p.NAME || p.County || 'Unknown';
                            l.bindPopup(`<strong>${county.charAt(0).toUpperCase() + county.slice(1)} County</strong><br>HDI: ${p.HDI ? p.HDI.toFixed(3) : 'N/A'}`);
                        }
                    }).addTo(map);
                    map.fitBounds(currentLayer.getBounds());

                    legend = L.control({position: 'bottomright'});
                    legend.onAdd = () => {
                        const div = L.DomUtil.create('div', 'legend');
                        const grades = [0, 0.3, 0.4, 0.5, 0.6, 0.7];
                        div.innerHTML = '<strong>HDI Scale</strong><br>';
                        grades.forEach(g => {
                            div.innerHTML += `<i style="background:${getColor(g + 0.05)}"></i> ${g}${grades[grades.indexOf(g)+1] ? '&ndash;' + grades[grades.indexOf(g)+1] : '+'}<br>`;
                        });
                        return div;
                    };
                    legend.addTo(map);
                })
                .catch(err => alert('Data load error: ' + err + '\nCheck if GeoJSON file is complete and valid.'));
        }

        updateMap();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mapping Development in Kenya - Crispus Kipkorir</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .info { position: absolute; top: 10px; left: 10px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.3); z-index: 1000; max-width: 350px; font-family: Arial, sans-serif; }
        .legend { background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); line-height: 18px; color: #555; }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="info">
        <h2>Mapping Development in Kenya</h2>
        <p><strong>Crispus Kipkorir</strong><br>University of Nairobi - MSc GIS<br>Web Mapping Project</p>
        <p>Select Indicator:
            <select id="indicator" onchange="updateMap()">
                <option value="Human Development Index_filtered.geojson">Human Development Index (HDI)</option>
            </select>
        </p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    const map = L.map('map').setView([0.5, 37.8], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let currentLayer = null;
    let legend = null;

    // New color function matching your legend exactly
    function getColor(hdi) {
        if (hdi < 0.42000) return '#f03b20';      // Very Low  (red)
        if (hdi < 0.47800) return '#fd8d3c';      // Low       (orange)
        if (hdi < 0.53200) return '#fecc5c';      // Moderate  (light brown/yellow)
        if (hdi < 0.58600) return '#ffffb2';      // High      (very light green/yellow)
        return '#41ab5d';                         // Very High (dark green)
    }

    // Legend labels matching your image
    function getCategory(hdi) {
        if (hdi < 0.42000) return 'Very Low';
        if (hdi < 0.47800) return 'Low';
        if (hdi < 0.53200) return 'Moderate';
        if (hdi < 0.58600) return 'High';
        return 'Very High';
    }

    function updateMap() {
        const file = document.getElementById('indicator').value;

        if (currentLayer) map.removeLayer(currentLayer);
        if (legend) map.removeControl(legend);

        fetch(file)
            .then(r => {
                if (!r.ok) throw new Error('File not loaded');
                return r.json();
            })
            .then(data => {
                currentLayer = L.geoJSON(data, {
                    style: feature => ({
                        fillColor: getColor(feature.properties.HDI || 0),
                        weight: 1.5,
                        opacity: 1,
                        color: 'white',
                        fillOpacity: 0.7
                    }),
                    onEachFeature: (feature, layer) => {
                        const p = feature.properties;
                        const county = p.adm1_name || p.NAME || p.County || 'Unknown';
                        const hdi = p.HDI ? p.HDI.toFixed(3) : 'N/A';
                        const category = p.HDI ? getCategory(p.HDI) : '';
                        layer.bindPopup(
                            `<strong>${county.charAt(0).toUpperCase() + county.slice(1)} County</strong><br>` +
                            `HDI: ${hdi}<br>` +
                            `Category: ${category}`
                        );
                    }
                }).addTo(map);

                map.fitBounds(currentLayer.getBounds());

                // Create legend matching your screenshot
                legend = L.control({ position: 'bottomright' });

                legend.onAdd = () => {
                    const div = L.DomUtil.create('div', 'legend');
                    div.style.background = 'white';
                    div.style.padding = '10px';
                    div.style.borderRadius = '5px';
                    div.style.boxShadow = '0 0 10px rgba(0,0,0,0.2)';
                    div.style.lineHeight = '18px';
                    div.style.color = '#555';

                    const grades = [
                        { max: 0.42000, label: 'Very Low', color: '#f03b20' },
                        { max: 0.47800, label: 'Low', color: '#fd8d3c' },
                        { max: 0.53200, label: 'Moderate', color: '#fecc5c' },
                        { max: 0.58600, label: 'High', color: '#ffffb2' },
                        { max: Infinity, label: 'Very High', color: '#41ab5d' }
                    ];

                    div.innerHTML = '<strong>Legend</strong><br>';

                    grades.forEach(g => {
                        let range;
                        if (g.max === 0.42000) range = '0.37000 – 0.42000';
                        else if (g.max === 0.47800) range = '0.42000 – 0.47800';
                        else if (g.max === 0.53200) range = '0.47800 – 0.53200';
                        else if (g.max === 0.58600) range = '0.53200 – 0.58600';
                        else range = '0.58600 – 0.64000';

                        div.innerHTML +=
                            `<i style="background:${g.color}; width:18px; height:18px; float:left; margin-right:8px; opacity:0.7;"></i>` +
                            `${range}<br><strong style="margin-left:26px;">${g.label}</strong><br><br>`;
                    });

                    return div;
                };

                legend.addTo(map);
            })
            .catch(err => alert('Data load error: ' + err + '\nCheck if GeoJSON file is complete and valid.'));
    }

    updateMap();
</script>
